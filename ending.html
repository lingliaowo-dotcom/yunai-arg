<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>结局 - 云爱小学</title>
<style>
  body { background:#1A1A2E; font-family:"PingFang SC","Microsoft YaHei",sans-serif; margin:0; padding:20px; }
  .wrap { width:680px; margin:0 auto; }
  .header { text-align:center; padding:20px 0; border-bottom:2px solid #FF6B35; margin-bottom:24px; }
  .header h1 { color:#FF6B35; font-size:22px; margin:0; letter-spacing:4px; }
  .header p { color:#888; font-size:12px; margin-top:6px; }
  .ending-card { background:#0F0F1A; border:1px solid #333; padding:24px; margin-bottom:24px; }
  .ending-card h2 { color:#4ECCA3; font-size:16px; margin-top:0; border-bottom:1px solid #333; padding-bottom:10px; }
  .ending-card p { color:#CCC; font-size:14px; line-height:1.9; }
  .wb-mock { background:#F6F6F6; border-radius:12px; overflow:hidden; margin:16px 0; }
  .wb-head { background:#FFF; padding:12px 14px; display:flex; align-items:center; border-bottom:1px solid #EBEBEB; }
  .wb-avatar { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#FFF; font-weight:bold; flex-shrink:0; }
  .wb-who { margin-left:10px; }
  .wb-nick { font-size:15px; color:#333; font-weight:600; }
  .wb-meta { font-size:11px; color:#999; }
  .wb-body { padding:12px 14px; background:#FFF; }
  .wb-text { font-size:15px; color:#333; line-height:1.7; }
  .wb-text .tag { color:#EB7340; }
  .wb-img { width:100%; border-radius:8px; margin-top:10px; }
  .wb-actions { display:flex; justify-content:space-around; padding:10px; border-top:1px solid #F0F0F0; font-size:12px; color:#999; }
  .cmt { padding:10px 14px; border-top:1px solid #F0F0F0; font-size:13px; background:#FFF; }
  .cmt .u { color:#5B6B7F; }
  .deleted-banner { background:#F7F7F7; color:#999; font-size:12px; text-align:center; padding:8px; border-top:1px dashed #DDD; }
  .ghost { text-align:center; padding:50px 20px; background:#FFF; }
  .ghost .big { font-size:44px; color:#DDD; }
  .ghost p { color:#999; font-size:14px; }
  .locked { text-align:center; padding:60px 20px; color:#666; }
  .locked h2 { color:#888; }
  .nav-back { text-align:center; margin-top:30px; }
  .nav-back a { color:#4ECCA3; text-decoration:none; border:1px solid #4ECCA3; padding:10px 24px; display:inline-block; }
  .choice-badge { display:inline-block; background:#4ECCA3; color:#0F0F1A; padding:4px 12px; font-size:12px; font-weight:bold; margin-left:8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>结 局<span id="choiceBadge" class="choice-badge"></span></h1>
    <p>云爱小学 · 热搜调查团 · 最终章</p>
  </div>

  <div id="locked" class="locked" style="display:none;">
    <h2>结局尚未开启</h2>
    <p>请先前往档案管理员后台做出选择。</p>
    <p style="margin-top:30px;"><a href="archive.html?unlock=1" style="color:#4ECCA3;">→ 进入档案管理员后台</a></p>
  </div>

  <div id="content"></div>

  <div class="nav-back">
    <a href="index.html">← 返回云爱小学首页</a>
  </div>
</div>

<div style="text-align:center;font-size:12px;color:#666666;padding:8px;">｜ <a href="https://space.bilibili.com/11015701" target="_blank">作者B站</a></div>
<script src="state.js"></script>
<script>
(function() {
  var choice = YA.getChoice();
  var content = document.getElementById('content');
  var locked = document.getElementById('locked');
  var badge = document.getElementById('choiceBadge');

  if (!choice) {
    locked.style.display = 'block';
    return;
  }

  var choiceNames = { A: '全量公开', B: '剪辑公开', C: '放弃公开' };
  badge.textContent = choiceNames[choice] || '';

  var endings = {
    A: `
      <div class="ending-card">
        <h2>■ 结局：全量公开</h2>
        <p>你们选择了把所有证据都抛向舆论场。包括那段录音。</p>
        <p>热搜爆了。案子立了。但有些东西，也跟着碎了。</p>
      </div>
      <div class="wb-mock">
        <div class="wb-head">
          <div class="wb-avatar" style="background:#C7000B;">新</div>
          <div class="wb-who">
            <div class="wb-nick">雾港新闻</div>
            <div class="wb-meta">20:05 来自 微博 weibo.com</div>
          </div>
        </div>
        <div class="wb-body">
          <div class="wb-text">
            【<span class="tag">#某小学教师体罚学生案立案#</span>】记者今日从雾港警方获悉，云爱小学教师陈某（男，58岁）因涉嫌虐待被监护、看护人罪，已被依法采取刑事强制措施。
          </div>
        </div>
        <div class="wb-actions"><span>转发 12.4万</span><span>评论 8.9万</span><span>赞 45.2万</span></div>
      </div>
      <div class="wb-mock">
        <div class="wb-head">
          <div class="wb-avatar" style="background:#888;">Q</div>
          <div class="wb-who">
            <div class="wb-nick">YA-0347</div>
            <div class="wb-meta">23:47 来自 网页版</div>
          </div>
        </div>
        <div class="wb-body">
          <div class="wb-text">我要的不是这个。</div>
        </div>
        <div class="wb-actions"><span>转发 —</span><span>评论已关闭</span><span>赞 1</span></div>
        <div class="ghost">
          <div class="big">(´・_・`)</div>
          <p>用户不存在或已注销</p>
        </div>
      </div>
      <div class="ending-card">
        <h2>■ 代价</h2>
        <p style="color:#999;">录音曝光后，老校长的女儿——那位救治过林满的医生——被人肉搜索。她的医院、工号、甚至家庭住址，都成了热搜的养料。</p>
        <p style="color:#999;">林满注销了账号。他想要的从来不是这个。</p>
      </div>
    `,
    B: `
      <div class="ending-card">
        <h2>■ 结局：剪辑公开（真结局）</h2>
        <p>你们选择了精准而克制的正义。证据足以定罪，录音被永久封存。</p>
        <p>这是当年教室里，第一次有人为34号举手。</p>
      </div>
      <div class="wb-mock">
        <div class="wb-head">
          <div class="wb-avatar" style="background:#888;">Q</div>
          <div class="wb-who">
            <div class="wb-nick">YA-0347</div>
            <div class="wb-meta">私信 · 23:12</div>
          </div>
        </div>
        <div class="wb-body">
          <img class="wb-img" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=foggy%20harbor%20pier%20at%20night%2C%20single%20warm%20street%20lamp%20glowing%20on%20old%20wooden%20dock%2C%20dark%20calm%20sea%2C%20mist%2C%20cinematic%20photography%2C%20melancholic%20quiet%20mood&image_size=landscape_16_9" alt="第七码头">
          <div class="wb-text" style="margin-top:10px;">灯还亮着。</div>
        </div>
      </div>
      <div class="wb-mock">
        <div class="wb-head">
          <div class="wb-avatar" style="background:#FF8200;">雪</div>
          <div class="wb-who">
            <div class="wb-nick">宋雪今天也不想上班</div>
            <div class="wb-meta">09:02 来自 微博 weibo.com</div>
          </div>
        </div>
        <div class="wb-body">
          <div class="wb-text">失物招领处，关门了。<span class="tag">#某小学教师体罚学生案一审开庭#</span></div>
          <img class="wb-img" src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=two%20halves%20of%20an%20old%20pink%20eraser%20joined%20together%20on%20a%20worn%20wooden%20school%20desk%2C%20faint%20chalk%20line%20across%20the%20desk%2C%20macro%20photography%2C%20soft%20morning%20window%20light%2C%20nostalgic%20warm%20tone&image_size=landscape_4_3" alt="拼合的橡皮">
        </div>
        <div class="wb-actions"><span>转发 3.1万</span><span>评论 2.4万</span><span>赞 18.7万</span></div>
        <div class="cmt"><span class="u">@热搜调查团-小高：</span>拼上了。二十二年，拼上了。</div>
        <div class="cmt"><span class="u">@雾港今天不下雨：</span>「到。」</div>
      </div>
      <div class="ending-card">
        <h2>■ 后续</h2>
        <p>陈某被依法判刑。云爱小学三年二班教室被保留为校史陈列室。</p>
        <p>林满没有离开雾港。他偶尔会去第七码头，一个人站一会儿。</p>
      </div>
    `,
    C: `
      <div class="ending-card">
        <h2>■ 结局：放弃公开</h2>
        <p>你们选择了沉默。证据包关闭了，热搜沉下去了，一切好像什么都没发生过。</p>
        <p>但有些东西，确实发生了。</p>
      </div>
      <div class="wb-mock">
        <div class="wb-head">
          <div class="wb-avatar" style="background:#FF8200;">雪</div>
          <div class="wb-who">
            <div class="wb-nick">宋雪今天也不想上班</div>
            <div class="wb-meta">23:58 来自 微博 weibo.com</div>
          </div>
        </div>
        <div class="wb-body">
          <div class="wb-text">不后悔。<br><br>……吧。</div>
        </div>
        <div class="deleted-banner">此微博已被作者删除 · 发布于 2 分钟前</div>
      </div>
      <div class="wb-mock">
        <div class="wb-head">
          <div class="wb-avatar" style="background:#26A69A;">通</div>
          <div class="wb-who">
            <div class="wb-nick">云爱百事通</div>
            <div class="wb-meta">10:14 来自 微博 weibo.com</div>
          </div>
        </div>
        <div class="wb-body">
          <div class="wb-text">有校友发现，云爱小学官网的滚动字幕好像更新了。<br>就一句话。<br>这个网站不是已经二十年没人维护了吗？</div>
        </div>
        <div class="wb-actions"><span>转发 127</span><span>评论 96</span><span>赞 402</span></div>
      </div>
      <div class="ending-card">
        <h2>■ 三天后</h2>
        <p>云爱小学官网的滚动字幕，只剩下一句：</p>
        <p style="text-align:center;font-size:18px;color:#4ECCA3;">「谢谢你们来过。」</p>
        <p style="color:#999;font-size:13px;">没有人知道是谁更新的。网站后台最后一次登录记录，停留在2005年3月12日。</p>
      </div>
    `
  };

  content.innerHTML = endings[choice] || '<div class="ending-card"><p>结局数据异常。</p></div>';
})();
</script>
</body>
</html>
