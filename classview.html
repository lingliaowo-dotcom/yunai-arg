<script>
function getQuery(name) {
  var search = location.search;
  if (!search || search.length < 2) return '';
  search = search.substring(1);
  var pairs = search.split('&');
  for (var i = 0; i < pairs.length; i++) {
    var kv = pairs[i].split('=');
    if (kv[0] === name) {
      return kv[1] ? decodeURIComponent(kv[1]) : '';
    }
  }
  return '';
}

var g = parseInt(getQuery('g'), 10);
var c = parseInt(getQuery('c'), 10);
var valid = !(isNaN(g) || isNaN(c) || g < 1 || g > 6 || c < 1 || c > 3);
if (!valid) {
  location.replace('class.html');
}

if (valid) {
var gradeNames = ['一年级', '二年级', '三年级', '四年级', '五年级', '六年级'];
var classNames = ['一班', '二班', '三班'];
var gradeName = gradeNames[g - 1];
var className = classNames[c - 1];
var fullName = gradeName + className;

var teacherNames = ['王老师', '李老师', '张老师', '刘老师', '杨老师', '赵老师'];
var teacher = teacherNames[(g * 3 + c - 4) % teacherNames.length];

var starNames = ['王小明', '李小红', '张小华', '刘小芳', '陈小军', '杨小丽', '赵小勇', '孙小娟'];
var stars = [];
for (var i = 0; i < 3; i++) {
  stars.push(starNames[(g * 7 + c * 3 + i) % starNames.length]);
}

var notices = [];
notices.push('本周五下午进行大扫除，请同学们带好抹布。');
notices.push('下周一开始收取秋季校服费，请家长及时准备。');

var schedule = [
  ['语文', '数学', '英语', '体育', '美术'],
  ['数学', '语文', '自然', '音乐', '思想品德'],
  ['语文', '数学', '英语', '社会', '体育'],
  ['数学', '语文', '自然', '美术', '劳动'],
  ['语文', '数学', '英语', '音乐', '班会']
];

if (g === 3 && c === 2) {
  teacher = '陈老师';
  notices.push('请勿在放学后逗留器材室。——2004.10.15');
}

var html = '';
html += '<h2>' + fullName + '</h2>';

html += '<h3>■ 班主任</h3>';
html += '<p>' + teacher + '</p>';

html += '<h3>■ 班级之星</h3>';
html += '<p>' + stars.join('、') + '</p>';

html += '<h3>■ 班级公告</h3>';
html += '<ul>';
for (var i = 0; i < notices.length; i++) {
  html += '<li>' + notices[i] + '</li>';
}
html += '</ul>';

html += '<h3>■ 课程表</h3>';
html += '<table class="info">';
html += '<tr><th>节次</th><th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th></tr>';
var periods = ['第一节', '第二节', '第三节', '第四节', '第五节'];
for (var r = 0; r < periods.length; r++) {
  html += '<tr><td>' + periods[r] + '</td>';
  for (var d = 0; d < 5; d++) {
    html += '<td>' + schedule[d][r] + '</td>';
  }
  html += '</tr>';
}
html += '</table>';

if (g === 3 && c === 2) {
  html += '<h3>■ 毕业生去向</h3>';
  html += '<div class="gray-box">';
  html += '本班2004年毕业，共35人。其中34人信息完整，第34号信息缺失。';
  html += '<br><a href="yearbook.html">查看校庆纪念册 →</a>';
  html += '</div>';
}

html += '<p style="text-align:center;margin-top:24px;"><a href="class.html">返回班级列表</a></p>';

var contentEl = document.getElementById('content');
if (contentEl) {
  contentEl.innerHTML = html;
}

document.title = fullName + ' - 云爱小学';
}
</script>
